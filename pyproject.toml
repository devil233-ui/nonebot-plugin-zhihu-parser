[project]
name = "nonebot-plugin-zhihu-parser"
version = "0.1.0"
description = "知乎链接解析与图文转发的 NoneBot2 插件"
authors = [
  {name = "devil233", email = "1250226509@qq.com"}
]
license = {text = "MIT"}
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["nonebot2", "zhihu", "知乎", "链接解析"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
]
dependencies = [
    "nonebot2>=2.3.0",
    "nonebot-adapter-onebot>=2.4.0",
    "nonebot-plugin-apscheduler>=0.4.0",
    "curl_cffi>=0.7.0",
    "beautifulsoup4>=4.12.0",
    "tqdm>=4.67.3",
    "aiofiles>=23.1.0",
    "Pillow>=9.5.0",
    "apilmoji<=0.3.1",
    "aiohttp>=3.8.0",
    "httpx>=0.27.0",
    "msgspec>=0.18.0",
    "typing_extensions>=4.1.0"
]

[project.urls]
Homepage = "https://github.com/devil233-ui/nonebot-plugin-zhihu-parser"
Repository = "https://github.com/devil233-ui/nonebot-plugin-zhihu-parser"
Issues = "https://github.com/devil233-ui/nonebot-plugin-zhihu-parser/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.nonebot]
plugins = ["nonebot_plugin_zhihu_parser"]
